name: Build polyiphone IPA

on: [workflow_dispatch]

jobs:
  build-ios:
    runs-on: macos-15-intel
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Register PolyTouchControls Safely
        run: |
          if [ ! -f "Polytoria/scripts/Mobile/PolyTouchControls.cs" ]; then
            echo "ERROR: Polytoria/scripts/Mobile/PolyTouchControls.cs not found!"
            exit 1
          fi
          find Polytoria \( -name "*.cs" -o -name "*.tscn" \) -exec sed -i '' 's/Waiting for server\.\.\.//g' {} +
          sed -i '' '/PolyTouchControls=/d' Polytoria/project.godot
          if ! grep -q '^\[autoload\]' Polytoria/project.godot; then
            printf '\n[autoload]\n' >> Polytoria/project.godot
          fi
          awk '/^\[autoload\]/ { print; print "PolyTouchControls=\"*res://scripts/Mobile/PolyTouchControls.cs\""; next } { print }' Polytoria/project.godot > Polytoria/project.godot.tmp && mv Polytoria/project.godot.tmp Polytoria/project.godot
          grep -A 5 '^\[autoload\]' Polytoria/project.godot

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Godot 4 (.NET Templates & Glue)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true
          include-templates: true

      - name: Cache Patched Godot 4.7.2 Editor
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/patched-godot
          key: godot-4.7.2-ios-csharp-macos-v3

      - name: Checkout Godot 4.7.2 Source
        if: steps.cache-godot.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7.2-stable
          path: godot-src

      - name: Build Patched Godot 4.7.2 Editor (Bypass C# iOS Block)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          brew install scons
          mv godot-src /tmp/godot-src
          python3 -c 'import glob; [open(p, "w", encoding="utf-8").writelines([l for l in open(p, encoding="utf-8", errors="ignore").read().splitlines(True) if "Exporting to an Apple Embedded platform is not supported" not in l]) for p in glob.glob("/tmp/godot-src/**", recursive=True) if p.endswith(".py")]'
          cd /tmp/godot-src
          scons platform=macos arch=x86_64 target=editor module_mono_enabled=yes vulkan=no angle=no accesskit=no -j$(sysctl -n hw.ncpu)
          ./bin/godot.macos.editor.x86_64.mono --headless --generate-mono-glue modules/mono/glue
          python3 modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --godot-platform=macos
          mkdir -p ~/patched-godot
          cp -r ./bin/* ~/patched-godot/

      - name: Restore and Build C# Assembly
        run: |
          CSPROJ=$(find Polytoria -name "*.csproj" | head -n 1)
          if [ -n "$CSPROJ" ]; then
            dotnet restore "$CSPROJ"
            dotnet build "$CSPROJ" -c Release -p:DefineConstants="ALLOW_SELFHOST"
          fi

      - name: Export iOS Project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/ios" "$HOME/bin"
          cat << 'EOF' > "$HOME/bin/xcodebuild"
          #!/bin/bash
          exec /usr/bin/xcodebuild "$@" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO OTHER_LDFLAGS='$(inherited) -Wl,-U,_MTLTensorDomain'
          EOF
          chmod +x "$HOME/bin/xcodebuild"
          export PATH="$HOME/bin:$PATH"
          TPL_DIR="$HOME/Library/Application Support/Godot/export_templates"
          if [ -d "$TPL_DIR/4.7.2.stable.mono" ] && [ ! -e "$TPL_DIR/4.7.2.stable" ]; then
            ln -s "$TPL_DIR/4.7.2.stable.mono" "$TPL_DIR/4.7.2.stable"
          fi
          grep -v "PolytoriaExportPlugin" Polytoria/project.godot | grep -v "DeeplinkPlugin" > Polytoria/project.godot.tmp && mv Polytoria/project.godot.tmp Polytoria/project.godot
          sed -i '' 's/config\/name="Polytoria"/config\/name="polyiphone"/g' Polytoria/project.godot
          if [ -f "Polytoria/export_presets.cfg" ]; then
            sed -i '' 's/Apple Distribution//g' Polytoria/export_presets.cfg
            sed -i '' 's/Apple Development//g' Polytoria/export_presets.cfg
            sed -i '' 's/application\/provisioning_profile_uuid_release="[^"]*"/application\/provisioning_profile_uuid_release=""/g' Polytoria/export_presets.cfg
            sed -i '' 's/application\/provisioning_profile_uuid_debug="[^"]*"/application\/provisioning_profile_uuid_debug=""/g' Polytoria/export_presets.cfg
          fi
          printf '\n[rendering]\nrenderer/rendering_method="mobile"\nrenderer/rendering_method.mobile="mobile"\nanti_aliasing/quality/msaa_3d=0\nlights_and_shadows/directional_shadow/size=1024\n' >> Polytoria/project.godot
          GODOT_BIN=~/patched-godot/godot.macos.editor.x86_64.mono
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --headless --path Polytoria --import
          "$GODOT_BIN" --headless --verbose --path Polytoria --export-release "iOS" "$GITHUB_WORKSPACE/build/ios/polyiphone.xcodeproj"
          test -f "$GITHUB_WORKSPACE/build/ios/polyiphone.xcodeproj/project.pbxproj" || { echo "ERROR: Godot did not generate polyiphone.xcodeproj"; exit 1; }

      - name: Build Unsigned IPA
        run: |
          cd "$GITHUB_WORKSPACE/build/ios"
          PROJ_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          if [ -z "$PROJ_FILE" ]; then echo "ERROR: No .xcodeproj"; exit 1; fi
          SCHEME=$(basename "$PROJ_FILE" .xcodeproj)
          cat << 'EOF' > ios26_stubs.m
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>

          NSString * const MTLTensorDomain = @"MTLTensorDomain";

          static UIWindow *polyWin = nil;
          static WKWebView *polyWeb = nil;
          static NSString *queuedDeepLink = nil;

          @interface PolyWebNav : NSObject <WKNavigationDelegate, WKUIDelegate>
          @end
          @implementation PolyWebNav
          - (void)webView:(WKWebView *)webView decidePolicyForNavigationAction:(WKNavigationAction *)action decisionHandler:(void (^)(WKNavigationActionPolicy))handler {
            NSURL *u = action.request.URL;
            if (u && [u.scheme.lowercaseString isEqualToString:@"polytoria"]) {
              queuedDeepLink = [u.absoluteString copy];
              dispatch_async(dispatch_get_main_queue(), ^{ polyWin.hidden = YES; });
              handler(WKNavigationActionPolicyCancel);
              return;
            }
            handler(WKNavigationActionPolicyAllow);
          }
          - (WKWebView *)webView:(WKWebView *)webView createWebViewWithConfiguration:(WKWebViewConfiguration *)configuration forNavigationAction:(WKNavigationAction *)navigationAction windowFeatures:(WKWindowFeatures *)windowFeatures {
            if (navigationAction.request.URL) [webView loadRequest:navigationAction.request];
            return nil;
          }
          - (void)goBack { if ([polyWeb canGoBack]) [polyWeb goBack]; }
          - (void)goHome { [polyWeb loadRequest:[NSURLRequest requestWithURL:[NSURL URLWithString:@"https://polytoria.com"]]]; }
          - (void)reloadPage { [polyWeb reload]; }
          - (void)hideWeb { polyWin.hidden = YES; }
          @end

          static PolyWebNav *polyNav = nil;

          #ifdef __cplusplus
          extern "C" {
          #endif
          void poly_show_polydroid_web(void) {
            dispatch_async(dispatch_get_main_queue(), ^{
              if (!polyWin) {
                UIWindowScene *scene = nil;
                for (UIScene *s in [UIApplication sharedApplication].connectedScenes) {
                  if ([s isKindOfClass:[UIWindowScene class]]) { scene = (UIWindowScene *)s; break; }
                }
                polyWin = scene ? [[UIWindow alloc] initWithWindowScene:scene] : [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
                polyWin.windowLevel = UIWindowLevelAlert + 10;
                UIViewController *vc = [[UIViewController alloc] init];
                vc.view.backgroundColor = [UIColor colorWithRed:0.07 green:0.075 blue:0.094 alpha:1.0];
                polyNav = [[PolyWebNav alloc] init];

                UIView *bar = [[UIView alloc] initWithFrame:CGRectMake(0, 0, polyWin.bounds.size.width, 46)];
                bar.autoresizingMask = UIViewAutoresizingFlexibleWidth;
                bar.backgroundColor = [UIColor colorWithRed:0.11 green:0.12 blue:0.15 alpha:1.0];

                NSArray *titles = @[@"< Back", @"Home", @"Reload", @"Hide"];
                SEL sels[] = {@selector(goBack), @selector(goHome), @selector(reloadPage), @selector(hideWeb)};
                CGFloat bw = polyWin.bounds.size.width / 4.0;
                for (int i = 0; i < 4; i++) {
                  UIButton *b = [UIButton buttonWithType:UIButtonTypeSystem];
                  b.frame = CGRectMake(i * bw, 0, bw, 46);
                  b.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleLeftMargin | UIViewAutoresizingFlexibleRightMargin;
                  [b setTitle:titles[i] forState:UIControlStateNormal];
                  [b setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
                  [b addTarget:polyNav action:sels[i] forControlEvents:UIControlEventTouchUpInside];
                  [bar addSubview:b];
                }
                [vc.view addSubview:bar];

                WKWebViewConfiguration *cfg = [[WKWebViewConfiguration alloc] init];
                cfg.allowsInlineMediaPlayback = YES;
                polyWeb = [[WKWebView alloc] initWithFrame:CGRectMake(0, 46, polyWin.bounds.size.width, polyWin.bounds.size.height - 46) configuration:cfg];
                polyWeb.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
                polyWeb.navigationDelegate = polyNav;
                polyWeb.UIDelegate = polyNav;
                [polyWeb loadRequest:[NSURLRequest requestWithURL:[NSURL URLWithString:@"https://polytoria.com"]]];
                [vc.view addSubview:polyWeb];
                polyWin.rootViewController = vc;
              }
              polyWin.hidden = NO;
              [polyWin makeKeyAndVisible];
            });
          }

          void poly_hide_polydroid_web(void) {
            dispatch_async(dispatch_get_main_queue(), ^{
              if (polyWin) polyWin.hidden = YES;
            });
          }

          const char *poly_pop_deeplink(void) {
            __block const char *res = NULL;
            void (^work)(void) = ^{
              if (queuedDeepLink) {
                res = strdup([queuedDeepLink UTF8String]);
                queuedDeepLink = nil;
              }
            };
            if ([NSThread isMainThread]) work();
            else dispatch_sync(dispatch_get_main_queue(), work);
            return res;
          }
          #ifdef __cplusplus
          }
          #endif
          EOF
          xcrun -sdk iphoneos clang -arch arm64 -fobjc-arc -c ios26_stubs.m -o ios26_stubs.o
          xcodebuild -project "$PROJ_FILE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -arch arm64 CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO OTHER_LDFLAGS="\$(inherited) $PWD/ios26_stubs.o -framework WebKit" CONFIGURATION_BUILD_DIR="$PWD/out" build
          APP_PATH=$(find out -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then echo "ERROR: .app not found"; exit 1; fi
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.yousef.polyiphone" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string polytoria" "$APP_PATH/Info.plist"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry polyiphone.ipa Payload

      - name: Upload polyiphone.ipa
        uses: actions/upload-artifact@v4
        with:
          name: polyiphone-ipa
          path: build/ios/polyiphone.ipa
