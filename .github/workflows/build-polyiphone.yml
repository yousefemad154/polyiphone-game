name: Build polyiphone IPA

on: [workflow_dispatch]

jobs:
  build-ios:
    runs-on: macos-15-intel
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Register PolyTouchControls Safely
        run: |
          cp PolyTouchControls.cs Polytoria/PolyTouchControls.cs
          python3 -c '
          p = "Polytoria/project.godot"
          txt = open(p, encoding="utf-8").read()
          if "PolyTouchControls=" not in txt:
              if "[autoload]" in txt:
                  txt = txt.replace("[autoload]", "[autoload]\nPolyTouchControls=\"*res://PolyTouchControls.cs\"", 1)
              else:
                  txt += "\n[autoload]\nPolyTouchControls=\"*res://PolyTouchControls.cs\"\n"
              open(p, "w", encoding="utf-8").write(txt)
          print("=== AUTOLOAD CHECK ===")
          for line in open(p, encoding="utf-8"):
              if "autoload" in line or "PolyTouchControls" in line:
                  print(line.strip())
          '

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Godot 4 (.NET Templates & Glue)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true
          include-templates: true

      - name: Cache Patched Godot 4.7.2 Editor
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/patched-godot
          key: godot-4.7.2-ios-csharp-macos-v3

      - name: Checkout Godot 4.7.2 Source
        if: steps.cache-godot.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7.2-stable
          path: godot-src

      - name: Build Patched Godot 4.7.2 Editor (Bypass C# iOS Block)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          brew install scons
          mv godot-src /tmp/godot-src
          python3 -c 'import glob; [open(p, "w", encoding="utf-8").writelines([l for l in open(p, encoding="utf-8", errors="ignore").read().splitlines(True) if "Exporting to an Apple Embedded platform when using C#/.NET is experimental" not in l]) for p in glob.glob("/tmp/godot-src/platform/**/export/*.cpp", recursive=True)]'
          cd /tmp/godot-src
          scons platform=macos arch=x86_64 target=editor module_mono_enabled=yes vulkan=no angle=no accesskit=no -j$(sysctl -n hw.ncpu)
          ./bin/godot.macos.editor.x86_64.mono --headless --generate-mono-glue modules/mono/glue
          python3 modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --godot-platform=macos
          mkdir -p ~/patched-godot
          cp -r ./bin/* ~/patched-godot/

      - name: Restore and Build C# Assembly
        run: |
          CSPROJ=$(find Polytoria -name "*.csproj" | head -n 1)
          if [ -n "$CSPROJ" ]; then
            dotnet restore "$CSPROJ"
            dotnet build "$CSPROJ" -c Release -p:DefineConstants="ALLOW_SELFHOST"
          fi

      - name: Export iOS Project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/ios"
          TPL_DIR="$HOME/Library/Application Support/Godot/export_templates"
          if [ -d "$TPL_DIR/4.7.2.stable.mono" ] && [ ! -e "$TPL_DIR/4.7.2.stable" ]; then
            ln -s "$TPL_DIR/4.7.2.stable.mono" "$TPL_DIR/4.7.2.stable"
          fi
          sed -i '' 's/, "res:\/\/addons\/PolytoriaExportPlugin\/plugin.cfg"//g' Polytoria/project.godot
          sed -i '' 's/config\/name="Polytoria"/config\/name="polyiphone"/g' Polytoria/project.godot
          printf '\n[rendering]\nrenderer/rendering_method="mobile"\nrenderer/rendering_method.mobile="mobile"\nanti_aliasing/quality/msaa_3d=0\nlights_and_shadows/directional_shadow/size=1024\n' >> Polytoria/project.godot
          GODOT_BIN=~/patched-godot/godot.macos.editor.x86_64.mono
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --headless --path Polytoria --import || true
          "$GODOT_BIN" --headless --verbose --path Polytoria --export-release "iOS" "$GITHUB_WORKSPACE/build/ios/polyiphone.xcodeproj" || true

      - name: Build Unsigned IPA
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/ios" && cd "$GITHUB_WORKSPACE/build/ios"
          PROJ_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          if [ -z "$PROJ_FILE" ]; then echo "ERROR: No .xcodeproj"; exit 1; fi
          printf '%s\n' '#import <Foundation/Foundation.h>' '#import <UIKit/UIKit.h>' '#import <WebKit/WebKit.h>' 'extern __attribute__((weak)) NSString * const CADynamicRangeAutomatic = @"automatic";' 'extern __attribute__((weak)) NSString * const CADynamicRangeConstrainedHigh = @"constrainedHigh";' 'extern __attribute__((weak)) NSString * const CADynamicRangeHigh = @"high";' 'extern __attribute__((weak)) NSString * const CADynamicRangeStandard = @"standard";' 'extern __attribute__((weak)) NSErrorDomain const MTLTensorDomain = @"MTLTensorDomain";' 'static UIView *gWebContainer = nil;' 'static WKWebView *gWebView = nil;' 'static NSString *gInterceptedDeeplink = nil;' 'static UIWindow* PolyKeyWindow(void) { UIWindow *fallback = nil; for (UIScene *s in [UIApplication sharedApplication].connectedScenes) { if ([s isKindOfClass:[UIWindowScene class]]) { for (UIWindow *w in ((UIWindowScene *)s).windows) { if (!fallback) fallback = w; if (w.isKeyWindow) return w; } } } return fallback; }' '@interface PolyWebHandler : NSObject <WKNavigationDelegate, WKUIDelegate>' '@end' '@implementation PolyWebHandler' '- (void)onBack { if ([gWebView canGoBack]) [gWebView goBack]; }' '- (void)onHome { [gWebView loadRequest:[NSURLRequest requestWithURL:[NSURL URLWithString:@"https://polytoria.com"]]]; }' '- (void)onReload { [gWebView reload]; }' '- (void)onHide { if (gWebContainer) gWebContainer.hidden = YES; }' '- (void)webView:(WKWebView *)wv decidePolicyForNavigationAction:(WKNavigationAction *)action decisionHandler:(void (^)(WKNavigationActionPolicy))handler { NSURL *u = action.request.URL; if (u && [[u.scheme lowercaseString] isEqualToString:@"polytoria"]) { gInterceptedDeeplink = [u.absoluteString copy]; if (gWebContainer) gWebContainer.hidden = YES; handler(WKNavigationActionPolicyCancel); return; } handler(WKNavigationActionPolicyAllow); }' '- (WKWebView *)webView:(WKWebView *)wv createWebViewWithConfiguration:(WKWebViewConfiguration *)cfg forNavigationAction:(WKNavigationAction *)action windowFeatures:(WKWindowFeatures *)wf { if (!action.targetFrame && action.request.URL) [wv loadRequest:action.request]; return nil; }' '@end' 'static PolyWebHandler *gHandler = nil;' 'extern "C" void poly_show_polydroid_web(void) { dispatch_async(dispatch_get_main_queue(), ^{ UIWindow *win = PolyKeyWindow(); if (!win) return; if (!gWebContainer) { gHandler = [[PolyWebHandler alloc] init]; gWebContainer = [[UIView alloc] initWithFrame:win.bounds]; gWebContainer.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight; gWebContainer.backgroundColor = [UIColor colorWithRed:0.075 green:0.086 blue:0.11 alpha:1.0]; UIView *bar = [[UIView alloc] initWithFrame:CGRectMake(0, 0, win.bounds.size.width, 46)]; bar.autoresizingMask = UIViewAutoresizingFlexibleWidth; bar.backgroundColor = [UIColor colorWithRed:0.105 green:0.122 blue:0.157 alpha:1.0]; NSArray *titles = @[@"< Back", @"Home", @"Reload", @"Hide to Game"]; SEL sels[] = {@selector(onBack), @selector(onHome), @selector(onReload), @selector(onHide)}; for (int i = 0; i < 4; i++) { UIButton *b = [UIButton buttonWithType:UIButtonTypeSystem]; b.frame = CGRectMake(12 + i * 115, 7, 108, 32); [b setTitle:titles[i] forState:UIControlStateNormal]; [b setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal]; b.backgroundColor = (i == 3) ? [UIColor colorWithRed:0.85 green:0.25 blue:0.25 alpha:1.0] : [UIColor colorWithRed:0.18 green:0.21 blue:0.27 alpha:1.0]; b.layer.cornerRadius = 6; [b addTarget:gHandler action:sels[i] forControlEvents:UIControlEventTouchUpInside]; [bar addSubview:b]; } [gWebContainer addSubview:bar]; WKWebViewConfiguration *cfg = [[WKWebViewConfiguration alloc] init]; cfg.allowsInlineMediaPlayback = YES; gWebView = [[WKWebView alloc] initWithFrame:CGRectMake(0, 46, win.bounds.size.width, win.bounds.size.height - 46) configuration:cfg]; gWebView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight; gWebView.navigationDelegate = gHandler; gWebView.UIDelegate = gHandler; gWebView.customUserAgent = @"Mozilla/5.0 (iPad; CPU OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"; [gWebContainer addSubview:gWebView]; [win addSubview:gWebContainer]; [gWebView loadRequest:[NSURLRequest requestWithURL:[NSURL URLWithString:@"https://polytoria.com"]]]; } gWebContainer.hidden = NO; [win bringSubviewToFront:gWebContainer]; }); }' 'extern "C" void poly_hide_polydroid_web(void) { dispatch_async(dispatch_get_main_queue(), ^{ if (gWebContainer) gWebContainer.hidden = YES; }); }' 'extern "C" const char* poly_pop_deeplink(void) { if (!gInterceptedDeeplink) return ""; char *copy = strdup([gInterceptedDeeplink UTF8String]); gInterceptedDeeplink = nil; return copy; }' > ios26_stubs.m
          xcrun -sdk iphoneos clang++ -x objective-c++ -c ios26_stubs.m -arch arm64 -fobjc-arc -o ios26_stubs.o
          SCHEME=$(basename "$PROJ_FILE" .xcodeproj)
          set -o pipefail
          xcodebuild -project "$PROJ_FILE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -derivedDataPath "$GITHUB_WORKSPACE/build/derived" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" ENABLE_BITCODE=NO OTHER_LDFLAGS="\$(inherited) -ld_classic -framework WebKit $GITHUB_WORKSPACE/build/ios/ios26_stubs.o" build
          APP_PATH=$(find "$GITHUB_WORKSPACE/build/derived" -name "*.app" | head -n 1)
          mkdir -p Payload && cp -r "$APP_PATH" Payload/polyiphone.app
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName polyiphone" Payload/polyiphone.app/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleName polyiphone" Payload/polyiphone.app/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" Payload/polyiphone.app/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" Payload/polyiphone.app/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.yousef.polyiphone" Payload/polyiphone.app/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" Payload/polyiphone.app/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string polytoria" Payload/polyiphone.app/Info.plist || true
          zip -r "$GITHUB_WORKSPACE/polyiphone.ipa" Payload

      - name: Upload polyiphone.ipa
        uses: actions/upload-artifact@v4
        with:
          name: polyiphone-ipa
          path: polyiphone.ipa
