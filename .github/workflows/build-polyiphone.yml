name: Build polyiphone IPA

on: [workflow_dispatch]

jobs:
  build-ios:
    runs-on: macos-15-intel
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Register PolyTouchControls Safely
        run: |
          CTRL_PATH=$(find Polytoria -iname "PolyTouchControls.cs" | head -n 1)
          if [ -n "$CTRL_PATH" ]; then
            REL_PATH="${CTRL_PATH#Polytoria/}"
            if ! grep -q "PolyTouchControls=" Polytoria/project.godot; then
              awk -v line="PolyTouchControls=\"*res://$REL_PATH\"" '
                /^\[autoload\]/ { print; print line; next }
                { print }
              ' Polytoria/project.godot > Polytoria/project.godot.tmp && mv Polytoria/project.godot.tmp Polytoria/project.godot
            fi
          fi

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Godot 4 (.NET Templates & Glue)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true
          include-templates: true

      - name: Cache Patched Godot 4.7.2 Editor
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/patched-godot
          key: godot-4.7.2-ios-csharp-macos-v3

      - name: Checkout Godot 4.7.2 Source
        if: steps.cache-godot.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7.2-stable
          path: godot-src

      - name: Build Patched Godot 4.7.2 Editor (Bypass C# iOS Block)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          brew install scons
          mv godot-src /tmp/godot-src
          python3 -c '
          import glob
          for path in glob.glob("/tmp/godot-src/platform/**/export/*.cpp", recursive=True):
              txt = open(path, encoding="utf-8", errors="ignore").read()
              if "Exporting to an Apple Embedded platform when using C#/.NET is experimental" in txt:
                  lines = [l for l in txt.splitlines(True) if "Exporting to an Apple Embedded platform when using C#/.NET is experimental" not in l]
                  open(path, "w", encoding="utf-8").writelines(lines)
                  print("Patched:", path)
          '
          cd /tmp/godot-src
          scons platform=macos arch=x86_64 target=editor module_mono_enabled=yes vulkan=no angle=no accesskit=no -j$(sysctl -n hw.ncpu)
          ./bin/godot.macos.editor.x86_64.mono --headless --generate-mono-glue modules/mono/glue
          python3 modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --godot-platform=macos
          mkdir -p ~/patched-godot
          cp -r ./bin/* ~/patched-godot/

      - name: Restore and Build C# Assembly
        run: |
          CSPROJ=$(find Polytoria -name "*.csproj" | head -n 1)
          if [ -n "$CSPROJ" ]; then
            dotnet restore "$CSPROJ"
            dotnet build "$CSPROJ" -c Release
          fi

      - name: Build Unsigned IPA
        run: |
          cd "$GITHUB_WORKSPACE/build/ios"
          PROJ_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          if [ -z "$PROJ_FILE" ]; then
            echo "ERROR: Godot did not generate an .xcodeproj."
            exit 1
          fi
          SCHEME=$(basename "$PROJ_FILE" .xcodeproj)
          set -o pipefail
          xcodebuild -project "$PROJ_FILE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -derivedDataPath "$GITHUB_WORKSPACE/build/derived" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="" ENABLE_BITCODE=NO OTHER_LDFLAGS='$(inherited) -ld_classic' build 2>&1 | tee "$GITHUB_WORKSPACE/xcode.log" || {
            echo "=== XCODE LINKER DETAILS ==="
            grep -B 15 -A 2 "linker command failed" "$GITHUB_WORKSPACE/xcode.log" | tail -n 20
            grep -E "error:|fatal error:|Undefined symbols|library not found" "$GITHUB_WORKSPACE/xcode.log" | tail -n 15
            exit 1
          }
          APP_PATH=$(find "$GITHUB_WORKSPACE/build/derived" -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/polyiphone.app
          zip -r "$GITHUB_WORKSPACE/polyiphone.ipa" Payload


      - name: Upload polyiphone.ipa
        uses: actions/upload-artifact@v4
        with:
          name: polyiphone-ipa
          path: polyiphone.ipa
