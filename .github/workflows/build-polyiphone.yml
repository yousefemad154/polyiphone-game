name: Build polyiphone IPA

on: [workflow_dispatch]

jobs:
  build-ios:
    runs-on: macos-15-intel
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Godot 4 (.NET)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true
          include-templates: true

      - name: Restore C# Dependencies
        run: |
          CSPROJ=$(find Polytoria -name "*.csproj" | head -n 1)
          if [ -n "$CSPROJ" ]; then
            dotnet restore "$CSPROJ"
          fi

      - name: Export iOS Xcode Project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/ios"
          godot --headless --path Polytoria --export-release "iOS" "$GITHUB_WORKSPACE/build/ios/polyiphone.xcodeproj"

      - name: Build Unsigned IPA
        run: |
          cd "$GITHUB_WORKSPACE/build/ios"
          PROJ_FILE=$(ls -d *.xcodeproj | head -n 1)
          SCHEME="${PROJ_FILE%.xcodeproj}"
          xcodebuild -project "$PROJ_FILE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -derivedDataPath "$GITHUB_WORKSPACE/build/derived" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          APP_PATH=$(find "$GITHUB_WORKSPACE/build/derived" -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/polyiphone.app
          zip -r "$GITHUB_WORKSPACE/polyiphone.ipa" Payload

      - name: Upload polyiphone.ipa
        uses: actions/upload-artifact@v4
        with:
          name: polyiphone-ipa
          path: polyiphone.ipa
