name: Build polyiphone IPA

on: [workflow_dispatch]

jobs:
  build-ios:
    runs-on: macos-15-intel
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Clean project.godot and Verify iOS Preset
        run: |
          python3 -c '
          p = "Polytoria/project.godot"
          with open(p, "r", encoding="utf-8", errors="ignore") as f:
              t = f.read()
          if "[autoload]" in t:
              t = t.split("[autoload]")[0]
          with open(p, "w", encoding="utf-8") as f:
              f.write(t.rstrip() + "\n")
          '
          if [ ! -f "Polytoria/export_presets.cfg" ]; then
            cat << 'EOF' > Polytoria/export_presets.cfg
          [preset.0]
          name="iOS"
          platform="iOS"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          application/bundle_identifier="com.yousef.polyiphone"
          application/signature="POLY"
          application/short_version="1.0"
          application/version="1.0"
          application/targeted_device_family=2
          EOF
          fi

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Godot 4 (.NET)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true
          include-templates: true

      - name: Restore and Build C# Assembly
        run: |
          CSPROJ=$(find Polytoria -name "*.csproj" | head -n 1)
          if [ -n "$CSPROJ" ]; then
            dotnet restore "$CSPROJ"
            dotnet build "$CSPROJ" -c Release
          fi

      - name: Export iOS Project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build/ios"
          godot --headless --verbose --path Polytoria --export-release "iOS" "$GITHUB_WORKSPACE/build/ios/polyiphone.ipa" || true
          ls -la "$GITHUB_WORKSPACE/build/ios"

      - name: Build Unsigned IPA
        run: |
          cd "$GITHUB_WORKSPACE/build/ios"
          if [ -f "polyiphone.ipa" ]; then
            cp polyiphone.ipa "$GITHUB_WORKSPACE/polyiphone.ipa"
            exit 0
          fi
          PROJ_FILE=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          if [ -z "$PROJ_FILE" ]; then
            echo "ERROR: Godot did not generate an .xcodeproj or .ipa. Check the Export iOS Project log above."
            exit 1
          fi
          SCHEME=$(basename "$PROJ_FILE" .xcodeproj)
          xcodebuild -project "$PROJ_FILE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -derivedDataPath "$GITHUB_WORKSPACE/build/derived" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          APP_PATH=$(find "$GITHUB_WORKSPACE/build/derived" -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Xcode build succeeded but no .app bundle was found."
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/polyiphone.app
          zip -r "$GITHUB_WORKSPACE/polyiphone.ipa" Payload

      - name: Upload polyiphone.ipa
        uses: actions/upload-artifact@v4
        with:
          name: polyiphone-ipa
          path: polyiphone.ipa
